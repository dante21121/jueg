<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHEL: RimWorld Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="night-overlay"></div>

    <div id="ui-layer">
        <h2>AETHEL: Colonia</h2>
        <div class="stats">
            <p>Día: <span id="ui-dia" class="highlight">1</span> | Hora: <span id="ui-hora" class="highlight">06:00</span></p>
            <p>Recursos: <span id="ui-biomasa" style="color: #a0e6ff; font-weight: bold;">0 Biomasa</span> | <span id="ui-comida" style="color: #ffaa00; font-weight: bold;">10 Comida</span></p>
            <hr>
            <p><strong>Herramienta (ESPACIO para cambiar)</strong></p>
            <p><span id="tool-mode" class="highlight">1. Extraer (Minar Tejido)</span></p>
            <hr>
            <div id="colono-list">
                <!-- Se llenará dinámicamente por JS -->
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
